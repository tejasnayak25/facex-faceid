<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>FaceX roster builder</title></head>
<body>
<pre id="out">loading…</pre>
<script src="sdk/detect.js"></script>
<script src="sdk/facex.js"></script>
<script src="sdk/align.js"></script>
<script src="sdk/facex-sdk.js"></script>
<script>
const out = (s) => { document.getElementById('out').textContent += '\n' + s; };
window.__done = false;
window.__result = null;

const loadImg = (url) => new Promise((res, rej) => {
  const i = new Image();
  i.crossOrigin = 'anonymous';
  i.onload = () => res(i);
  i.onerror = () => rej(new Error('load failed: ' + url));
  i.src = url;
});
const cos = (a, b) => { let s = 0, na = 0, nb = 0; for (let i = 0; i < a.length; i++) { s += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; } return s / (Math.sqrt(na) * Math.sqrt(nb)); };

function cropThumb(img, box) {
  const bw = box.x2 - box.x1, bh = box.y2 - box.y1;
  const side = Math.max(bw, bh) * 1.3;
  const cx = (box.x1 + box.x2) / 2, cy = (box.y1 + box.y2) / 2;
  const c = document.createElement('canvas');
  c.width = 96; c.height = 96;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 96, 96);
  ctx.drawImage(img, cx - side / 2, cy - side / 2, side, side, 0, 0, 96, 96);
  return c.toDataURL('image/jpeg', 0.6);
}

(async () => {
  const fx = new FaceXSDK({
    detWeightsUrl: 'models/yunet_fp32.bin',
    embWeightsUrl: 'models/edgeface_xs_fp32.bin',
    onProgress: (m) => out('· ' + m),
  });
  await fx.load();
  out('SDK loaded');

  // urls: { students: [{key, roll, name, images: [url...]}, ...], maxPerStudent }
  window.__run = async (students, maxPerStudent) => {
    const result = { students: [], failed: [] };
    const dim = 512;
    for (const st of students) {
      const picked = st.images.slice(0, maxPerStudent);
      const embs = [];
      let thumb = '';
      for (const url of picked) {
        try {
          const img = await loadImg(url);
          const r = fx.process(img);
          if (!r.embeddings.length) { out(`   no face: ${url}`); continue; }
          // pick the best face (highest score), keep embedding + thumb
          let best = 0;
          for (let j = 1; j < r.faces.length; j++) if (r.faces[j].score > r.faces[best].score) best = j;
          embs.push(r.embeddings[best]);
          if (!thumb) thumb = cropThumb(img, r.faces[best]);
        } catch (e) { out(`   error: ${url} — ${e.message || e}`); }
      }
      if (!embs.length) { result.failed.push({ roll: st.roll, name: st.name, reason: 'no face in any photo' }); continue; }
      // average + renormalize (like webcam enrollment)
      const avg = new Float32Array(dim);
      for (const e of embs) for (let i = 0; i < dim; i++) avg[i] += e[i] / embs.length;
      let norm = 0; for (let i = 0; i < dim; i++) norm += avg[i] * avg[i];
      norm = Math.sqrt(norm) || 1;
      for (let i = 0; i < dim; i++) avg[i] /= norm;
      result.students.push({ name: st.name, roll: st.roll, embedding: Array.from(avg), thumb, shots: embs.length, enrolledAt: Date.now(), engine: 'sdk' });
      out(`✓ ${st.name} (${st.roll}) — ${embs.length}/${picked.length} photos used`);
    }
    return result;
  };
  out('WORKER READY');
  window.__done = true;
})().catch(e => { out('ERROR: ' + (e && e.stack || e && e.message || e)); window.__done = true; });
</script>
</body>
</html>
