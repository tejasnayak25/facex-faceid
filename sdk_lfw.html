<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>SDK LFW eval</title></head>
<body>
<pre id="out">loading…</pre>
<script src="sdk/detect.js"></script>
<script src="sdk/facex.js"></script>
<script src="sdk/align.js"></script>
<script src="sdk/facex-sdk.js"></script>
<script>
const out = (s) => { document.getElementById('out').textContent += '\n' + s; };
const loadImg = (url) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });

(async () => {
  const PAIRS_URL = '/wfpairs.json';
  const pairs = await (await fetch(PAIRS_URL)).json();
  out(`pairs: ${pairs.length}`);
  const fx = new FaceXSDK({
    detWeightsUrl: 'models/yunet_fp32.bin',
    embWeightsUrl: 'models/edgeface_xs_fp32.bin',
    onProgress: (m) => out('· ' + m),
  });
  await fx.load();
  out('SDK loaded');
  const LFW = '/data/lfw-deepfunneled/';
  const imgCache = new Map();
  async function embOf(name, n) {
    const key = name + '/' + n;
    if (imgCache.has(key)) return imgCache.get(key);
    const img = await loadImg(`${LFW}${name}/${name}_${String(n).padStart(4, '0')}.jpg`);
    const r = fx.process(img);
    const e = r.embeddings[0] || null;
    imgCache.set(key, e);
    return e;
  }
  const cos = (a, b) => { let s = 0, na = 0, nb = 0; for (let i = 0; i < a.length; i++) { s += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; } return s / (Math.sqrt(na) * Math.sqrt(nb)); };
  const sims = [];
  let noFace = 0;
  for (let i = 0; i < pairs.length; i++) {
    const [aName, aN, bName, bN, same] = pairs[i];
    const [ea, eb] = await Promise.all([embOf(aName, aN), embOf(bName, bN)]);
    if (!ea || !eb) { noFace++; sims.push(-1); } else sims.push(cos(ea, eb));
    if ((i + 1) % 100 === 0) out(`pair ${i + 1}/${pairs.length}…`);
  }
  const gen = sims.filter((_, i) => pairs[i][4] === 1), imp = sims.filter((_, i) => pairs[i][4] === 0);
  const all = [...gen.map(s => [s, 1]), ...imp.map(s => [s, 0])].sort((a, b) => a[0] - b[0]);
  let rankSum = 0; for (let i = 0; i < all.length; i++) if (all[i][1] === 1) rankSum += i + 1;
  const auc = (rankSum - gen.length * (gen.length + 1) / 2) / (gen.length * imp.length);
  const m = (a) => a.reduce((x, y) => x + y, 0) / a.length;
  out(`noFace: ${noFace}`);
  out(`genuine n=${gen.length} mean=${m(gen).toFixed(4)}`);
  out(`impostor n=${imp.length} mean=${m(imp).toFixed(4)} max=${Math.max(...imp).toFixed(4)}`);
  out(`AUC=${auc.toFixed(4)}`);
  for (const t of [0.25, 0.3, 0.35, 0.4, 0.45, 0.5]) {
    const frr = gen.filter(s => s < t).length / gen.length;
    const far = imp.filter(s => s >= t).length / imp.length;
    out(`thr ${t}: FRR=${(frr * 100).toFixed(1)}% FAR=${(far * 100).toFixed(1)}%`);
  }
  out('DONE');
  window.__done = true;
})().catch(e => { out('ERROR: ' + (e && e.stack || e && e.message || e)); window.__done = true; });
</script>
</body>
</html>
